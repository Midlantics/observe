[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midlantics-a2a"
version = "0.1.0"
description = "Midlantics A2A — agent observability and governance SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai", "agents", "observability", "governance", "llm", "opentelemetry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage    = "https://a2a.midlantics.com"
Repository  = "https://github.com/Navruzjon/a2a"
"Bug Tracker" = "https://github.com/Navruzjon/a2a/issues"

[project.optional-dependencies]
openai     = ["openai>=1.0"]
anthropic  = ["anthropic>=0.25"]
all        = ["openai>=1.0", "anthropic>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["midlantics_a2a*"]
